name: Build Android APK

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Release Keystore
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.RELEASE_KEYSTORE_B64 != ''
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > release-keystore.jks
        echo "Release keystore decoded successfully"

    - name: Run Lint
      run: ./gradlew lintDebug --stacktrace
      continue-on-error: true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace --info

    - name: Generate Test Coverage Report
      run: ./gradlew jacocoTestReport --stacktrace
      continue-on-error: true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          app/build/reports/tests/
          app/build/reports/lint-results-debug.html
          app/build/reports/jacoco/
        retention-days: 14

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: verum-omnis-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Build Release APK
      env:
        KEYSTORE_FILE: release-keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        if [ -f "release-keystore.jks" ]; then
          echo "Building release APK with release keystore"
        else
          echo "Building release APK with debug keystore (no release keystore configured)"
        fi
        ./gradlew assembleRelease --stacktrace --info

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: verum-omnis-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Clean up keystore
      if: always()
      run: rm -f release-keystore.jks
