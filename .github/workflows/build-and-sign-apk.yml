name: Build and Sign Android APK

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager --install "platform-tools"
        sdkmanager --install "platforms;android-34"
        sdkmanager --install "build-tools;34.0.0"

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: verum-omnis-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Decode Release Keystore
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          echo "Release keystore decoded successfully"
        else
          echo "No release keystore configured"
        fi

    - name: Build Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -f "release.keystore" ]; then
          echo "Building release APK with release keystore"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --stacktrace --info
        else
          echo "Building release APK with debug keystore"
          ./gradlew assembleRelease --stacktrace --info
        fi

    - name: Upload Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: verum-omnis-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Clean up keystore
      if: always()
      run: rm -f release.keystore
